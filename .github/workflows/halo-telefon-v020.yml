name: Build Halo Telefon v0.20

on:
  push:
    branches: [ halo-telefon-v020 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore Halo Telefon source
        run: |
          mkdir -p build-halo
          base64 -d halo-telefon-v020/source.tar.gz.b64 | tar -xz -C build-halo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare whisper.cpp and offline model
        working-directory: build-halo
        run: bash scripts/setup.sh

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.0.12077973"             "cmake;3.22.1"

      - name: Build debug APK
        working-directory: build-halo
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HaloTelefon-v0.20-debug
          path: build-halo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
